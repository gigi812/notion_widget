<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30case15</title>
<style>
  :root {
    --dot: #d9d9d9;
    --dot-active: #222222;
    --arrow-bg: rgba(255, 255, 255, 0.3);
    --arrow-fg: #222222;
    --frame-radius: 12px;
    --gap: 12px;
    --visible: 3; /* 데스크톱: 한 번에 3장 */
    --row-gap: 16px; /* row 사이 간격, 줄이고 싶으면 이 숫자만 조절 */
  }

  @media (max-width: 640px) {
    :root { --visible: 1; } /* 모바일: 한 번에 1장 */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  /* ===== Row 컨테이너: 캐러셀 여러 개를 세로로 쌓음 ===== */
  .carousel-rows {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--row-gap);
  }

  .carousel {
    width: 100%;
    position: relative;
  }

  .carousel-frame {
    position: relative;
    width: 100%;
    overflow: hidden;
    border-radius: var(--frame-radius);
  }

  .carousel-track {
    display: flex;
    gap: var(--gap);
    touch-action: pan-y;
    cursor: grab;
  }

  .carousel-track.dragging {
    cursor: grabbing;
  }

  .carousel-slide {
    flex: 0 0 calc((100% - (var(--visible) - 1) * var(--gap)) / var(--visible));
    aspect-ratio: 3 / 4; /* 세로 4:3 프레임으로 변경, 높이 낮아짐 */
    border-radius: var(--frame-radius);
    overflow: hidden;
    background: transparent;
  }

  .carousel-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .carousel-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--arrow-bg);
    color: var(--arrow-fg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    transition: background 0.2s ease, opacity 0.2s ease;
    z-index: 2;
  }

  .carousel-arrow:hover {
    background: rgba(255, 255, 255, 0.3);
  }

  .carousel-arrow:disabled {
    opacity: 0;
    pointer-events: none;
  }

  .carousel-arrow.prev { left: -6px; }
  .carousel-arrow.next { right: -6px; }

  @media (max-width: 640px) {
    .carousel-arrow.prev { left: 6px; }
    .carousel-arrow.next { right: 6px; }
  }

  .carousel-arrow svg {
    width: 16px;
    height: 16px;
  }

  .carousel-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
  }

  .carousel-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--dot);
    border: none;
    padding: 0;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .carousel-dot.active {
    background: var(--dot-active);
    width: 18px;
    border-radius: 3px;
  }
</style>
</head>
<body>

  <div class="carousel-rows">

    <!-- ===== Row 1 ===== -->
    <div class="carousel">
      <div class="carousel-frame">
        <div class="carousel-track">
          <!-- Row 1 이미지: src만 교체하세요 -->
          <div class="carousel-slide"><img src="./images/30.15 (1).jpg" alt="row1 slide 1"></div>
          <div class="carousel-slide"><img src="./images/30.15 (2).jpg" alt="row1 slide 2"></div>
          <div class="carousel-slide"><img src="./images/30.15 (3).jpg" alt="row1 slide 3"></div>
        </div>

        <button class="carousel-arrow prev" aria-label="Previous image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="carousel-arrow next" aria-label="Next image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <div class="carousel-dots"></div>
    </div>

    <!-- ===== Row 2 ===== -->
    <div class="carousel">
      <div class="carousel-frame">
        <div class="carousel-track">
          <!-- Row 2 이미지: src만 교체하세요 -->
          <div class="carousel-slide"><img src="./images/30.15 (4).jpg" alt="row2 slide 3"></div>
          <div class="carousel-slide"><img src="./images/30.15 (5).jpg" alt="row2 slide 3"></div>
          <div class="carousel-slide"><img src="./images/30.15 (6).jpg" alt="row2 slide 1"></div>
          <div class="carousel-slide"><img src="./images/30.15 (7).jpg" alt="row2 slide 2"></div>
          <div class="carousel-slide"><img src="./images/30.15 (8).jpg" alt="row2 slide 3"></div>
        </div>

        <button class="carousel-arrow prev" aria-label="Previous image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="carousel-arrow next" aria-label="Next image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <div class="carousel-dots"></div>
    </div>

  </div>

<script>
(function () {
  // 페이지 안의 .carousel 요소 각각을 독립적으로 초기화
  document.querySelectorAll('.carousel').forEach(initCarousel);

  function initCarousel(carousel) {
    const frame = carousel.querySelector('.carousel-frame');
    const track = carousel.querySelector('.carousel-track');
    const slides = Array.from(track.children);
    const dotsWrap = carousel.querySelector('.carousel-dots');
    const prevBtn = carousel.querySelector('.carousel-arrow.prev');
    const nextBtn = carousel.querySelector('.carousel-arrow.next');

    const count = slides.length;
    if (count < 3 || count > 5) {
      console.warn('이미지는 최소 3개, 최대 5개를 권장합니다. 현재:', count);
    }

    let index = 0;
    let startX = 0;
    let currentX = 0;
    let isDragging = false;

    function getVisible() {
      const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--visible'));
      return Math.min(v || 1, count);
    }

    function getStep() {
      const visible = getVisible();
      const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 0;
      const frameWidth = frame.clientWidth;
      const slideWidth = (frameWidth - gap * (visible - 1)) / visible;
      return slideWidth + gap;
    }

    function maxIndex() {
      return Math.max(0, count - getVisible());
    }

    function buildDots() {
      dotsWrap.innerHTML = '';
      const pages = maxIndex() + 1;
      for (let i = 0; i < pages; i++) {
        const dot = document.createElement('button');
        dot.className = 'carousel-dot' + (i === index ? ' active' : '');
        dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
        dot.addEventListener('click', () => goTo(i));
        dotsWrap.appendChild(dot);
      }
    }

    function updateUI() {
      track.style.transition = 'transform 0.35s cubic-bezier(0.22, 1, 0.36, 1)';
      track.style.transform = `translateX(${-index * getStep()}px)`;
      Array.from(dotsWrap.children).forEach((d, i) => d.classList.toggle('active', i === index));
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === maxIndex();
    }

    function goTo(i) {
      index = Math.max(0, Math.min(maxIndex(), i));
      updateUI();
    }

    prevBtn.addEventListener('click', () => goTo(index - 1));
    nextBtn.addEventListener('click', () => goTo(index + 1));

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        index = Math.min(index, maxIndex());
        buildDots();
        track.style.transition = 'none';
        track.style.transform = `translateX(${-index * getStep()}px)`;
      }, 100);
    });

    function dragStart(x) {
      isDragging = true;
      startX = x;
      currentX = 0;
      track.classList.add('dragging');
      track.style.transition = 'none';
    }

    function dragMove(x) {
      if (!isDragging) return;
      currentX = x - startX;
      track.style.transform = `translateX(${-index * getStep() + currentX}px)`;
    }

    function dragEnd() {
      if (!isDragging) return;
      isDragging = false;
      track.classList.remove('dragging');

      const threshold = getStep() * 0.2;
      if (currentX < -threshold && index < maxIndex()) {
        index++;
      } else if (currentX > threshold && index > 0) {
        index--;
      }
      updateUI();
    }

    track.addEventListener('touchstart', (e) => dragStart(e.touches[0].clientX), { passive: true });
    track.addEventListener('touchmove', (e) => dragMove(e.touches[0].clientX), { passive: true });
    track.addEventListener('touchend', dragEnd);

    track.addEventListener('mousedown', (e) => { e.preventDefault(); dragStart(e.clientX); });
    window.addEventListener('mousemove', (e) => dragMove(e.clientX));
    window.addEventListener('mouseup', dragEnd);

    buildDots();
    updateUI();
  }
})();
</script>

</body>
</html>
